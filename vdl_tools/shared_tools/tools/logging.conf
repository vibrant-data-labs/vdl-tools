[loggers]
keys=root,vdl_tools

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_vdl_tools]
level=INFO
handlers=consoleHandler
qualname=vdl_tools
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(levelname)s - {%(pathname)s:%(lineno)d} - %(message)s
