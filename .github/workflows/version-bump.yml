name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_part:
        description: 'Part to bump (major, minor, patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Get current version
      id: current
      run: echo "version=$(hatch version)" >> $GITHUB_OUTPUT
    
    - name: Bump version
      run: hatch version ${{ github.event.inputs.version_part }}
    
    - name: Get new version
      id: new
      run: echo "version=$(hatch version)" >> $GITHUB_OUTPUT
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "chore: bump version from ${{ steps.current.outputs.version }} to ${{ steps.new.outputs.version }}"
        title: "chore: bump version to ${{ steps.new.outputs.version }}"
        body: |
          Automated version bump from ${{ steps.current.outputs.version }} to ${{ steps.new.outputs.version }}
          
          Please review and merge this PR, then create a release tag.
        branch: version-bump-${{ steps.new.outputs.version }}
        delete-branch: true

